<style>
/* Layout: Wrangler-NFR feel — navy header band with gold condensed display type, red rule, route-badge stop board, per-stop detail view routed by #hash */
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6275; --line:#DDDAD0;
  --navy:#13294B; --navy-ink:#F4F1E8; --gold:#9C7A3C; --gold-hi:#C9A86A; --gold-soft:#EFE6D2; --red:#A6192E;
  --display:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Jost","Futura","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1527; --surface:#14203A; --ink:#ECE9E1; --muted:#A3A9B8; --line:#26334F;
  --navy:#081022; --navy-ink:#F4F1E8; --gold:#D4B373; --gold-hi:#D4B373; --gold-soft:#2E2817; --red:#D9475A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1527; --surface:#14203A; --ink:#ECE9E1; --muted:#A3A9B8; --line:#26334F;
  --navy:#081022; --navy-ink:#F4F1E8; --gold:#D4B373; --gold-hi:#D4B373; --gold-soft:#2E2817; --red:#D9475A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;color:var(--gold)}
h3{font-size:1.05rem;font-weight:700}
.eyebrow{font-family:var(--display);font-weight:500;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--navy-ink);border-bottom:4px solid var(--red)}
.top .wrap{display:flex;align-items:center;gap:12px 20px;padding-block:12px;flex-wrap:wrap}
.brand{text-decoration:none;display:flex;align-items:center;gap:10px}
.seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold-hi);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.62rem;line-height:1;color:var(--gold-hi);text-align:center;letter-spacing:.04em}
.brand b{font-family:var(--display);font-weight:600;font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-size:.72rem;color:#AEB4C3;font-weight:500}
.top nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.top nav a{text-decoration:none;font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;padding:8px 12px;border-radius:4px}
.top nav a:hover,.top nav a[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--gold-hi)}

.hero{background:var(--navy);color:var(--navy-ink)}
.hero .wrap{padding-block:44px 52px;display:grid;gap:32px;grid-template-columns:1.35fr 1fr;align-items:end}
.hero .eyebrow{color:var(--gold-hi)}
.hero h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(2.3rem,6.5vw,4.2rem);line-height:1;letter-spacing:.01em;color:var(--gold-hi);margin-top:10px}
.hero p{max-width:52ch;color:#C8CCD6;margin:16px 0 0}
.facts{display:grid;gap:1px;background:rgba(201,168,106,.35);border:1px solid rgba(201,168,106,.35);border-radius:6px;overflow:hidden;margin:0}
.facts div{background:var(--navy);padding:13px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.facts dt{font-family:var(--display);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#9EA6B8}
.facts dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}}

section.block{padding-block:52px;scroll-margin-top:120px}
section.block + section.block{border-top:1px solid var(--line)}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.head p{color:var(--muted);margin:0;max-width:65ch}

.tools{margin-bottom:8px}
.tools input{width:100%;max-width:420px;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.routes{display:grid;grid-template-columns:1fr;gap:0 36px}
@media (min-width:760px){.routes{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,7),auto)}}
.route{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.badge{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);line-height:1}
.badge small{font-size:.58rem;letter-spacing:.12em;font-weight:600}
.badge span{font-size:1.45rem;font-weight:600}
.route .tag{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:2px}
.route ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;min-width:0}
.route a{display:block;text-decoration:none;padding:4px 0}
.route a b{font-weight:700}
.route a:hover b{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.route a span{display:block;font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0;grid-column:1/-1}
.near{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:6px;padding:18px 20px;margin:12px 0 8px}
.near p{margin:6px 0 12px}
.near-go{display:flex;gap:14px;align-items:center;text-decoration:none}
.near-go > span{min-width:0}
.near-go b{display:block;font-size:1.1rem}
.near-go span span{color:var(--muted);font-size:.92rem}
.near-go:hover b{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.near-alt{color:var(--muted);font-size:.92rem;margin:12px 0 0!important}

.ada{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:760px){.ada{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold-soft);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.1rem}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.95rem}
.note{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;padding:20px 22px}
.note p{margin:8px 0 0;color:var(--muted)}
.contact{display:grid;gap:12px;margin:14px 0 18px}
.contact dt{font-family:var(--display);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.contact dd{margin:2px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.contact dd small{flex-basis:100%;font-size:.88rem;font-weight:400;color:var(--muted)}
.copy{font:inherit;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.incl-h{margin:0 0 6px}
.incl{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:2px}
.muted{color:var(--muted)}
.pending{color:var(--muted);font-weight:400}
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:18px 36px 18px 0;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:12px;font-family:var(--display);font-size:1.5rem;color:var(--gold)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 18px;color:var(--muted);max-width:65ch}

.crumb{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;text-decoration:none;color:var(--muted);margin-bottom:18px}
.crumb:hover{color:var(--ink)}
.dhead{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.dhead .who{display:flex;gap:16px;align-items:center;min-width:0}
.dhead h1{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.02;color:var(--gold)}
.dhead .addr{color:var(--muted);margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;padding:10px 16px;border-radius:4px;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.dgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:start}
@media (max-width:820px){.dgrid{grid-template-columns:1fr}}
.dgrid > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.panel + .panel{margin-top:16px}
.panel .eyebrow{display:block;margin-bottom:6px}
.spot{font-family:var(--display);font-weight:600;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.spot-note{color:var(--muted);margin-top:4px}
.spot-desc{margin:8px 0 0;max-width:60ch}
.dirs{margin:14px 0 0;padding-left:20px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}
.kv dt{font-family:var(--display);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv .sub{display:block;font-size:.88rem;color:var(--muted)}
.media{display:grid;gap:22px}
figure{margin:0}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.9rem;padding:16px;
  background:repeating-linear-gradient(135deg,transparent 0 12px,var(--gold-soft) 12px 13px),var(--surface)}
.shot{width:100%;max-width:100%;height:auto;aspect-ratio:auto;object-fit:contain;border-radius:6px;display:block;background:var(--surface)}
.shot.map{aspect-ratio:auto;height:auto;object-fit:contain;border:1px solid var(--line);background:#fff}
.mapl{display:block;cursor:zoom-in}
.credit{display:block;font-size:.75rem;opacity:.8}
figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font-weight:600;max-width:48%}
.pager small{display:block;font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

footer{background:var(--navy);color:#A3A9B8;font-size:.88rem;border-top:4px solid var(--red)}
footer .wrap{padding-block:30px;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}
footer b{color:var(--navy-ink)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

const FAQ = [
  ["Do I need a ticket to ride?","No. The NFR Express is free for all rodeo fans. Head to any pickup location below."],
  ["What are the service hours?",`Pre-event buses run ${SERVICE.pre} to the Thomas & Mack Center. Post-event buses run ${SERVICE.post} back to the host hotels. Every performance starts at ${SERVICE.start}.`],
  ["How often do buses leave my hotel?","Before the rodeo, it depends on the stop: some depart every 10 to 20 minutes, others hourly at 4:00, 5:00 and 6:00 PM. Your hotel’s page lists its schedule. After the rodeo, buses leave the Thomas & Mack Center continuously from 8:15 to 9:45 PM. A W Transportation Group Ambassador is posted at every pickup if you have questions."],
  ["What does the route number mean?","Hotels that share a route share buses. Ride back on the same route number you came on, and the bus will stop at each hotel on that route."],
  ["When does the last bus leave the Thomas & Mack Center?","The last buses depart at 9:45 PM, December 3 to 12. All schedules are subject to change."],
  ["Does the Cowboy Christmas shuttle bring me back to the convention center?","No. Route 1 is a one-way express to the Thomas & Mack Center. Buses never return to the Las Vegas Convention Center, so plan another way back if your car is parked there."],
  ["My hotel isn't listed. Can I still ride?","Yes. Buses only stop at the locations listed here, so ride from whichever one is closest to where you're staying."],
  ["Can I bring drinks on board?","Non-alcoholic drinks in plastic bottles or cups are fine. Aluminum bottles are allowed, and wide-mouth cups are allowed with a lid. No glass and no alcohol on the bus."],
  ["Is there room for strollers?","Yes. Fold your stroller and hand it to the driver when you board; it rides in an under-bus compartment. Ask the driver for it when you get off."],
  ["I left something on the bus. Where do I find it?","Items found on buses go straight to Lost & Found at the Thomas & Mack Center."],
  ["How do I get back if I stay after the last bus?","Rideshare (Lyft, Uber) and taxis are available at the front of the Thomas & Mack Center."]
];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q2=s=>encodeURIComponent((s.oneway?"":s.n+" Las Vegas, ")+s.ad);
const routes=[...new Set(STOPS.map(s=>s.r))];
const badge=r=>`<div class="badge" aria-label="Route ${r}"><small>ROUTE</small><span>${r}</span></div>`;
let query="";

function home(){
  return `<div class="view">
  <section class="hero"><div class="wrap">

      <h1>Ride the NFR Express to Thomas &amp; Mack Center</h1>

    <dl class="facts">
      <div><dt>Dates</dt><dd>Dec 3 – 12, 2026</dd></div>
      <div><dt>Pre-event</dt><dd>${SERVICE.pre}</dd></div>

      <div><dt>Rodeo starts</dt><dd>${SERVICE.start} nightly</dd></div>

  </div></section>

  <section class="block" id="locations"><div class="wrap">

    <div class="tools"><input id="q" type="search" placeholder="Search hotels" aria-label="Search hotels" value="${esc(query)}"></div>

  </div></section>

  <section class="block" id="accessible"><div class="wrap">

      <p>Wheelchair-accessible, ADA-compliant buses run all ten nights. Request one ahead of time by ${ADA.cutoff} on the day you ride. After ${ADA.cutoff}, requests are taken in person at your pickup.</p></div>

      <div class="note"><span class="eyebrow">Before ${ADA.cutoff} on the day you ride</span><h3>Request in advance</h3>
        <dl class="contact">
          <div><dt>Email</dt><dd><a href="mailto:${ADA.email}">${ADA.email}</a><button type="button" class="copy" data-copy="${ADA.email}">Copy</button></dd></div>
          <div><dt>Phone</dt><dd>${ADA.phone?`<a href="tel:${ADA.phone.replace(/[^0-9+]/g,"")}">${ADA.phone}</a><button type="button" class="copy" data-copy="${ADA.phone}">Copy</button><small>Leave a voicemail with the details below.</small>`:"<span class='pending'>Number coming soon</span>"}</dd></div>

      <ol class="steps">

        <li><div><b>Find the W Transportation Group Ambassador</b><span>An Ambassador is posted at every pickup during service hours.</span></div></li>

    <div class="faq">${FAQ.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>

function nearbyCards(q){
  if(q.length<3) return "";
  const hits=NEARBY.filter(h=>norm(h.n).includes(q)||h.k.some(k=>norm(k).startsWith(q)||q.includes(norm(k))));
  return hits.map(h=>{
    const [best,...alt]=h.to.map(byId);
    return `<div class="near"><span class="eyebrow">Not an NFR Express pickup</span>
      <p><b>${esc(h.n)}</b> isn't on a shuttle route. ${h.far?`The closest pickup is ${esc(h.far)}, so you'll need a rideshare or car to get there:`:"The closest pickup is:"}</p>
      <a class="near-go" href="#${best.id}">${badge(best.r)}<span><b>${esc(best.n)}</b><span>${esc(best.spot)}${best.freq?" · "+esc(best.freq):""}</span></span></a>
      ${alt.length?`<p class="near-alt">Also close: ${alt.map(a=>`<a href="#${a.id}">${esc(a.n)}</a> (Route ${a.r}${a.freq?", "+esc(a.freq.replace(/^Every/,"every").replace(/^Hourly/,"hourly")):""})`).join("; ")}</p>`:""}</div>`;
  }).join("");
}

function board(){
  const q=norm(query);
  const cards=routes.map(r=>{
    const g=STOPS.filter(s=>s.r===r&&(!q||norm(s.n+" "+s.spot).includes(q)||s.k.some(k=>norm(k).startsWith(q))));
    if(!g.length) return "";
    return `<div class="route">${badge(r)}<div style="min-width:0">${r===1?'<span class="tag">One-way express</span>':""}<ul>${g.map(s=>
      `<li><a href="#${s.id}"><b>${esc(s.n)}</b><span>${esc(s.spot)}${s.note?" · "+esc(s.note):""}</span></a></li>`).join("")}</ul></div></div>`;
  }).filter(Boolean);
  const near=nearbyCards(q);
  const html=(cards.length?`<div class="routes" style="--rows:${Math.ceil(cards.length/2)}">${cards.join("")}</div>`:"")+near;
  return html||`<p class="empty">No pickup matches “${esc(query)}”. Try a shorter name, or ride from the pickup closest to where you're staying.</p>`;
}

const ph=label=>`<figure><div class="ph">${label}<br>coming soon</div></figure>`;
function mediaBlock(s){
  const m=MEDIA[s.id]||{p:[],m:null};let h="";
  if(m.p.length){m.p.forEach((d,j)=>{const i=j+1,src=`photos/${s.id}${i>1?"-"+i:""}.jpg`;
    h+=`<figure><img class="shot" src="${src}" width="${d[0]}" height="${d[1]}" loading="${i>1?"lazy":"eager"}" alt="${i===1?"NFR Express pickup area at "+esc(s.n):"Another view near the "+esc(s.n)+" pickup"}"><figcaption>${i===1?"NFR Express pickup area":"Another view near the pickup"}${m.c?` <span class="credit">${esc(m.c)}</span>`:""}</figcaption></figure>`;});}
  else h+=ph("Pickup photo");
  if(m.m) h+=`<figure><a class="mapl" href="maps/${s.id}.jpg" target="_blank" rel="noopener"><img class="shot map" src="maps/${s.id}.jpg" width="${m.m[0]}" height="${m.m[1]}" loading="lazy" alt="${esc(s.n)} property map with the NFR Express pickup marked by a bus icon"></a><figcaption>Property map. The yellow bus icon marks the pickup. Tap the map to enlarge it.</figcaption></figure>`;
  return h;
}

function detail(s){
  const i=STOPS.indexOf(s),prev=STOPS[(i-1+STOPS.length)%STOPS.length],next=STOPS[(i+1)%STOPS.length];
  const mates=STOPS.filter(x=>x.r===s.r&&x!==s);
  return `<div class="view"><section class="block"><div class="wrap">
    <a class="crumb" href="#locations">← All pickups</a>
    <div class="dhead">
      <div class="who">${badge(s.r)}<div style="min-width:0"><h1>${esc(s.n)}</h1><div class="addr">${esc(s.ad)}</div></div></div>
      <div class="btns"><a class="btn primary" href="${s.g||"https://www.google.com/maps/search/?api=1&query="+q2(s)}" target="_blank" rel="noopener">Google Maps</a><a class="btn" href="https://maps.apple.com/?q=${q2(s)}" target="_blank" rel="noopener">Apple Maps</a></div>
    </div>
    <div class="dgrid">
      <div>
        <div class="panel"><span class="eyebrow">Where to board</span>
          <div class="spot">${esc(s.spot)}</div>${s.desc?`<p class="spot-desc">${esc(s.desc)}</p>`:s.note?`<div class="spot-note">${esc(s.note)}</div>`:""}

        </div>
        <div class="panel"><span class="eyebrow">Service</span>
          <dl class="kv">
            <dt>Route</dt><dd>Route ${s.r}${s.oneway?" · <strong>one way only</strong> to the Thomas &amp; Mack. No return to the convention center.":mates.length?" · also stops at "+mates.map(m=>`<a href="#${m.id}">${esc(m.n)}</a>`).join(", "):""}</dd>
            <dt>Pre-event</dt><dd>${SERVICE.pre}${s.freq?`<span class="sub">Departures: ${esc(s.freq.replace(/^Every/,"every").replace(/^Hourly/,"hourly"))}</span>`:""}</dd>
            <dt>Post-event</dt><dd>${s.oneway?"No return service":SERVICE.post+" from Thomas &amp; Mack Center<span class=\"sub\">Buses run continuously</span>"}</dd>
          </dl>
        </div>
      </div>
      <div class="media">
        ${mediaBlock(s)}
      </div>
    </div>
    <nav class="pager" aria-label="More pickups">
      <a href="#${prev.id}"><small>Previous</small>${esc(prev.n)}</a>

  </div></section></div>`;
}

const app=document.getElementById("app");
document.addEventListener("click",e=>{const b=e.target.closest(".copy");if(!b)return;const t=b.dataset.copy,done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};
  try{navigator.clipboard.writeText(t).then(done,()=>{sel(b)})}catch(_){sel(b)}});
function sel(b){const a=b.previousElementSibling;if(!a)return;const r=document.createRange();r.selectNodeContents(a);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected"}
function wire(){
  const b=document.getElementById("board");if(!b)return;
  b.innerHTML=board();
  document.getElementById("q").addEventListener("input",e=>{query=e.target.value;b.innerHTML=board()});
}
let onDetail=false;
function route(){
  const h=decodeURIComponent(location.hash.slice(1)),s=STOPS.find(x=>x.id===h);
  document.querySelectorAll("[data-nav]").forEach(a=>a.removeAttribute("aria-current"));
  if(s){app.innerHTML=detail(s);document.title=s.n+" · NFR Express";window.scrollTo(0,0);onDetail=true;return}
  document.title="NFR Express Rider Guide";
  if(onDetail||!app.innerHTML){app.innerHTML=home();wire();onDetail=false}
  const t=h&&document.getElementById(h);
  if(t){t.scrollIntoView();const n=document.querySelector(`[data-nav="${h}"]`);n&&n.setAttribute("aria-current","page")}
  else if(!h)window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
